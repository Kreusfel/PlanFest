<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>PlanFest</title>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Afficheur d'erreur : en cas de pépin JS, montre le message au lieu d'une page blanche.
    function pfShowError(txt) {
      var el = document.getElementById("app");
      if (el) el.innerHTML = '<pre style="margin:16px;padding:16px;border:1px solid #b4453f;border-radius:10px;'
        + 'background:#f6dad6;color:#b4453f;white-space:pre-wrap;font:13px/1.5 monospace">⚠ Erreur :\n'
        + String(txt).replace(/[<>&]/g, function (c) { return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]; })
        + '</pre>';
    }
    window.addEventListener("error", function (e) {
      pfShowError((e.message || e.error || "erreur") + "\n" + (e.filename || "") + (e.lineno ? ":" + e.lineno : ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      pfShowError("Promesse rejetée : " + ((e.reason && (e.reason.message || e.reason)) || e));
    });
  </script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
